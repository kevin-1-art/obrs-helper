services:
  - type: web
    name: obrs-helper
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/auth/session
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OBRS_BASE_URL
        value: https://obrs-api.ursb.go.ug
      - key: DATABASE_URL
        fromDatabase:
          name: obrs-helper-accounts
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true

databases:
  - name: obrs-helper-accounts
    databaseName: obrs_helper_accounts
    user: obrs_helper
    plan: free
    region: oregon
    ipAllowList: []
